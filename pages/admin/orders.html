<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shop - Quản Lý Đơn Hàng</title>
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body>

  <!-- Admin Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
        <path d="M3 6h18"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      Mini Shop Admin
    </div>

    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="products.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7.5 4.27 9 5.15M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
        Quản lý Sản phẩm
      </a>
      <a href="orders.html" class="admin-nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Quản lý Đơn hàng
      </a>
      <a href="../../index.html" class="admin-nav-item" style="margin-top: 12px; border-top: 1px solid var(--admin-border); padding-top: 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Xem Trang Khách
      </a>
    </nav>

    <button class="admin-logout-btn" onclick="authManager.logout(); window.location.href='../login.html';">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Đăng xuất Admin
    </button>
  </aside>

  <!-- Admin Main Content -->
  <main class="admin-main">
    <div class="admin-header">
      <h1 class="admin-page-title">Quản Lý Đơn Hàng Khách Đặt</h1>

      <div class="admin-header-right">
        <input type="text" class="admin-search-input" placeholder="Tìm kiếm đơn hàng...">
        
        <div class="admin-profile-badge">
          <div class="admin-avatar">A</div>
          <span>Quản trị viên</span>
        </div>
      </div>
    </div>

    <!-- Orders Table Card -->
    <div class="dashboard-card">
      <div class="card-head">
        <h3 class="card-title">Danh sách đơn hàng gần đây</h3>
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th style="width: 40px;">#</th>
            <th>Mã đơn</th>
            <th>Khách hàng</th>
            <th>Địa chỉ giao hàng</th>
            <th>Ngày đặt</th>
            <th>Số món</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th style="width: 100px;">Thao tác</th>
          </tr>
        </thead>
        <tbody id="adminOrdersTableBody">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="../../assets/js/products-data.js"></script>
  <script src="../../assets/js/auth-manager.js"></script>
  <script src="../../assets/js/admin-orders.js"></script>
</body>
</html>
