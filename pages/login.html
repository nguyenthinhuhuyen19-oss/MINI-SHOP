<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shop - Đăng Nhập</title>
  <meta name="description" content="Đăng nhập tài khoản tại Mini Shop.">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Shared Modular Header -->
  <div id="header-placeholder"></div>

  <main class="container">
    <!-- Breadcrumb Navigation -->
    <nav class="breadcrumb-nav">
      <div class="breadcrumb">
        <span class="breadcrumb-item"><a href="../index.html">Trang chủ</a></span>
        <span class="breadcrumb-separator">&gt;</span>
        <span class="breadcrumb-item active">Đăng nhập</span>
      </div>
    </nav>

    <!-- Login Auth Section -->
    <section class="auth-page-section">
      <div class="auth-card-container card-animate">
        <div class="auth-card">
          <h1 class="auth-title">Đăng Nhập</h1>
          <p class="auth-subtitle">Chào mừng bạn quay trở lại Mini Shop</p>

          <!-- Demo Credentials Helper Box -->
          <div class="demo-credentials-box">
            <div class="demo-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
              Tài khoản thử nghiệm nhanh:
            </div>
            <div class="demo-row">
              <span>👤 <strong>Khách hàng:</strong> user@minishop.vn / 123456</span>
              <button type="button" class="btn-demo-fill" onclick="fillDemo('user')">Điền mẫu</button>
            </div>
            <div class="demo-row">
              <span>🔑 <strong>Admin:</strong> admin@minishop.vn / admin123</span>
              <button type="button" class="btn-demo-fill" onclick="fillDemo('admin')">Điền mẫu</button>
            </div>
          </div>

          <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
              <label class="form-label" for="loginEmail">Email hoặc Tên đăng nhập <span class="required">*</span></label>
              <input type="text" class="form-input" id="loginEmail" placeholder="Nhập email hoặc tên đăng nhập" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="loginPassword">Mật khẩu <span class="required">*</span></label>
              <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-checkout" style="margin-top: 24px; padding: 14px; font-size: 1rem;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
              </svg>
              Đăng Nhập
            </button>
          </form>

          <div class="auth-switch-text">
            Chưa có tài khoản? <a href="register.html" class="auth-switch-link">Đăng ký ngay</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared Modular Footer -->
  <div id="footer-placeholder"></div>

  <script src="../assets/js/products-data.js"></script>
  <script src="../assets/js/cart-manager.js"></script>
  <script src="../assets/js/wishlist-manager.js"></script>
  <script src="../assets/js/auth-manager.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/auth-page.js"></script>
</body>
</html>
