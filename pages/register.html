<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shop - Đăng Ký Tài Khoản</title>
  <meta name="description" content="Đăng ký tài khoản khách hàng mới tại Mini Shop.">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Shared Modular Header -->
  <div id="header-placeholder"></div>

  <main class="container">
    <!-- Breadcrumb Navigation -->
    <nav class="breadcrumb-nav">
      <div class="breadcrumb">
        <span class="breadcrumb-item"><a href="../index.html">Trang chủ</a></span>
        <span class="breadcrumb-separator">&gt;</span>
        <span class="breadcrumb-item active">Đăng ký</span>
      </div>
    </nav>

    <!-- Register Auth Section -->
    <section class="auth-page-section">
      <div class="auth-card-container card-animate">
        <div class="auth-card">
          <h1 class="auth-title">Tạo Tài Khoản Mới</h1>
          <p class="auth-subtitle">Trở thành thành viên Mini Shop để nhận thêm ưu đãi</p>

          <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
            <div class="form-group">
              <label class="form-label" for="regFullName">Họ và tên <span class="required">*</span></label>
              <input type="text" class="form-input" id="regFullName" placeholder="Nguyễn Văn A" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="regEmail">Email <span class="required">*</span></label>
              <input type="email" class="form-input" id="regEmail" placeholder="nguyenvana@gmail.com" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="regPassword">Mật khẩu <span class="required">*</span></label>
              <input type="password" class="form-input" id="regPassword" placeholder="Tối thiểu 6 ký tự" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="regConfirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
              <input type="password" class="form-input" id="regConfirmPassword" placeholder="Nhập lại mật khẩu" required>
            </div>

            <button type="submit" class="btn-checkout" style="margin-top: 24px; padding: 14px; font-size: 1rem; background-color: var(--blue-btn);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="8.5" cy="7" r="4"/>
                <line x1="20" y1="8" x2="20" y2="14"/>
                <line x1="23" y1="11" x2="17" y2="11"/>
              </svg>
              Tạo Tài Khoản
            </button>
          </form>

          <div class="auth-switch-text">
            Đã có tài khoản? <a href="login.html" class="auth-switch-link">Đăng nhập ngay</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared Modular Footer -->
  <div id="footer-placeholder"></div>

  <script src="../assets/js/products-data.js"></script>
  <script src="../assets/js/cart-manager.js"></script>
  <script src="../assets/js/wishlist-manager.js"></script>
  <script src="../assets/js/auth-manager.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/auth-page.js"></script>
</body>
</html>
